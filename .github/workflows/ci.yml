name: Source and HTTP checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: requirements_test
          POSTGRES_PASSWORD: ci-only-disposable-password
          POSTGRES_DB: requirements_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U requirements_test -d requirements_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SWTOOL_TEST_DATABASE_URL: postgresql://requirements_test:ci-only-disposable-password@127.0.0.1:5432/requirements_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Verify declared source and licenses
        run: python scripts/verify-source.py
      - name: Run standalone HTTP tests against PostgreSQL
        run: python -m pytest tests -q
